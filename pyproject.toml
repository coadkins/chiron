# Build glue only. pixi-build-python uses hatchling to build the `chiron`
# package; its conda dependencies live in pixi.toml.

[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "chiron"
version = "0.2.0" # keep in sync with pixi.toml
description = "JupyterLab pre-loaded with LSP, vim bindings, R and Python."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cory Adkins" }]

[tool.hatch.build.targets.wheel]
packages = ["chiron"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/labconfig" = "etc/jupyter/labconfig"
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"
"pkg-data/activate.d/chiron.sh" = "etc/conda/activate.d/chiron.sh"
"pkg-data/kernels/ir" = "share/jupyter/kernels/ir"
